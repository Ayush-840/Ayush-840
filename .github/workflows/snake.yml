name: Generate Contribution Snake

on:
  schedule:
    # Run every 24 hours at midnight UTC
    - cron: "0 0 * * *"
  
  # Allows manual triggering from the Actions tab
  workflow_dispatch:
  
  # Run on every push to main branch
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Generate Contribution Snake SVGs (High Contrast Dark & Light themes)
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-light&color_snake=#A855F7
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00FF66&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Step 3: Commit and push generated snake SVGs
      - name: Commit and Push Snake SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-contribution-grid-snake.svg assets/github-contribution-grid-snake-dark.svg
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update contribution snake SVG [skip ci]" && git push)
